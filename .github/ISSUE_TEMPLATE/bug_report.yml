name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Never paste real card numbers, barcodes, APDU dumps of your cards or passphrases. **Security issues: use Security → Report a vulnerability.**"
  - type: input
    id: version
    attributes: { label: App version, description: "Settings → Updates" }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Phone and Android version, placeholder: "Pixel 8, Android 16" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, expected vs actual }
    validations: { required: true }
